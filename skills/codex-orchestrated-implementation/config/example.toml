version = 2

[technical_authority]
provider = "codex"
model = "gpt-5.6-terra"
reasoning_effort = "high"

[orchestrator]
provider = "codex"
model = "gpt-5.6-luna"
reasoning_effort = "high"

[[pair]]
name = "luna_worker"
provider = "codex"
model = "gpt-5.6-luna"
enabled = true

[[pair]]
name = "claude_worker"
provider = "claude_code"
model = "opus"
enabled = true

[workflow]
profile = "standard"
pairing_mode = "alternating"
first_implementer = "luna_worker"

[continuation]
progress_timeout_seconds = 600
implementation_timeout_seconds = 3600
review_timeout_seconds = 2400
max_transport_retries = 4
max_worker_retries = 2
poll_interval_seconds = 60
receipt_recovery_retries = 1
max_failed_invocations = 6
require_durable_wakeup = true
lease_duration_seconds = 120
max_reconciliation_attempts = 3
require_foreground_wait = true
require_finalization_gate = true

[limits]
max_correction_rounds = 20
max_correction_reviews_per_defect = 3
max_invocations = 48
max_failed_invocations = 6

[failover]
enabled = true
allow_luna_worker_fallback = true
require_terra_approval = true
fallback_reviewer = "luna_worker"
max_fallback_rounds = 1

[qwen_local]
enabled = false
endpoint = "https://127.0.0.1:8000/v1"
allowed_endpoints = ["https://127.0.0.1:8000/v1"]
model = "Qwen3.8-27B"
allowed_models = ["Qwen3.8-27B"]
tls_policy = "required"
# Set auth_mode = "none" if the local server does not require authentication.
# Otherwise the token is read from this environment variable, never this file.
auth_mode = "explicit_env"
auth_token_env = "LLM_BEARER_TOKEN"
max_context_tokens = 4096
max_input_tokens = 2048
max_output_tokens = 1024
reasoning_effort = "low"
timeout_seconds = 20
max_retries = 0
tools = false
skills = false
inherit_credentials = false
write_mode = "disabled"
